name: Deploy to GitHub Pages

# Publishes the app at https://<user>.github.io/<repo>/ after every push to main.
# Needs two repository VARIABLES (Settings > Secrets and variables > Actions > Variables), both public by design:
#   SUPABASE_URL              the project address, e.g. https://xxxx.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the publishable (anon) key - never the secret / service_role key
# Without them the app is built in on-device mode (no sign-in).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      # GitHub Pages has no "single page app" mode: an address such as /<repo>/settings would be a 404.
      # Serving the app itself as the 404 page makes every deep link open the app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
